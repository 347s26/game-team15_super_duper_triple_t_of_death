{% block content %}

<style>
.main {
    background: linear-gradient(135deg, #1f3c88, #39a2db);
    color: white;
    padding: 4rem 2rem;
    text-align: center;
    border-radius: 0 0 40px 40px;
}

.main h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
    letter-spacing: 2px;
}

.main p {
    font-size: 1.2rem;
    max-width: 600px;
    margin: 0 auto 2rem auto;
}

.main-buttons {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
}

.main-buttons a {
    padding: 12px 28px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-primary {
    background: white;
    color: #1f3c88;
}

.btn-primary:hover {
    background: #f2f2f2;
    transform: scale(1.05);
}

.btn-secondary {
    border: 2px solid white;
    color: white;
}

.btn-secondary:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.05);
}

.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2rem;
    padding: 3rem 2rem;
    text-align: center;
}

.feature-box {
    background: #f5f7fa;
    padding: 2rem;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.feature-box h3 {
    margin-bottom: 1rem;
    color: #1f3c88;
}

.feature-box p {
    color: #555;
}

.grid-preview {
    margin: 2rem auto;
    width: 180px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
}

.grid-preview div {
    background: white;
    border: 2px solid #1f3c88;
    aspect-ratio: 1;
}
</style>

<section class="main">
    <h1>Ultimate Tic-Tac-Toe</h1>
    <p>
        A game by jmu students.
    </p>

    <div class="grid-preview">
        {% for i in "123456789" %}
        <div></div>
        {% endfor %}
    </div>

    <div class="main-buttons">
      <a href="{% url 'login' %}" class="btn-primary">Sign In</a>
      <a href="/admin/" class="btn-secondary">Admin</a>
    </div>
</section>

{% endblock %}
